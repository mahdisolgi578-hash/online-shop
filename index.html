<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>online-shop</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/reset.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a href="#" class="header__logo">بازارینو</a>
      </div>
      <nav class="header-nav">
        <a href="#" class="header__link">خانه</a>
        <a href="#" class="header__link">فروشگاه</a>
        <a href="#" class="header__link">دسته بندی ها </a>
        <a href="#" class="header__link">درباره ما</a>
      </nav>
      <div>
        <a href="#" class="header__login">ورود</a>
        <a href="#" class="header__cart">سبد خرید</a>
      </div>
      <main class="main">
        <div class="container">
          <nav class="guid">خانه/فروشگاه</nav>
          <h1 class="page__title">فروشگاه</h1>
          <p class="page__subtitle">
            محصولات منتخب را با خیال راحت مقایسه وانتخاب کنید
          </p>

          <div class="catalog">
            <aside class="sidebar">
              <h2 class="sidebar__title">فیلتر محصولات</h2>
              <fieldset class="sidebar__group">
                <legend class="sidebar__legend">دسته ها</legend>
                <label class="check">
                  <input class="check__input" type="checkbox" />
                  <span class="check-label">دیجیتال و گجت</span>
                </label>
                <label class="check">
                  <input class="check__input" type="checkbox" />
                  <span>خانه و سبک زندگی</span>
                </label>
                <label class="check">
                  <input class="check__input" type="checkbox" />
                  <span>لوازم شخصی</span>
                </label>
              </fieldset>
              <fieldset class="sidebar__group">
                <legend class="sidebar__legend">محدوده قیمت</legend>
                <label class="radio">
                  <input class="radio__input" type="radio" />
                  <span class="radio__label">کمتر از 2 میلیون</span>
                </label>
                <label class="radio">
                  <input class="radio__input" type="radio" />
                  <span class="radio__label">2 تا 5 میلیون</span>
                </label>
                <label class="radio">
                  <input class="radio__input" type="radio" />
                  <span class="radio__label">بیشتر از 5 میلیون</span>
                </label>
              </fieldset>
              <fieldset class="sidebar__group">
                <legend class="sidebar__legend">امتیاز کاربران</legend>
                <label class="check">
                  <input class="check__input" type="checkbox" />
                  <span class="check__label">4 ستاره به بالا</span>
                </label>
              </fieldset>
            </aside>

            <section class="catalog__content">
              <div class="toolbar">
                <input
                  class="toolbar__search"
                  type="search"
                  placeholder="جستجو در محصولات..."
                />
                <div class="toolbar__row">
                  <label class="toolbar_sort">
                    مرتب سازی:
                    <select class="toolbar__select">
                      <option value="best-selling">پرفروش ترین</option>
                      <option value="cheapest">ارزان ترین</option>
                      <option value="most-expensive">گران ترین</option>
                    </select>
                  </label>
                  <span class="toolbar__count">نمایش 6 محصول</span>
                </div>
              </div>
              <div class="catalog__grid">
                <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset/headphone.jpg" alt="headphone" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>

                  <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset/watch.jpg" alt="watch" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>

                  <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset/camera.jpg" alt="camera" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>

                  <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset//keyboard.jpg" alt="mechanic keyboard" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>

                  <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset/speaker.jpg" alt="speaker" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>

                  <article class="product-card">
                    <a href="#" class="product-card__link">
                      <img src="./asset/travelmug.jpg" alt="travelmug" class="product-card__image" />
                      <div class="product-card__body">
                        <h3 class="product-card__title"></h3>
                        <div class="product-card__text">
                          <span class="product-card__price"></span>
                          <span class="product-card__rating"></span>
                        </div>
                      </div>
                    </a>
                  </article>
              </div>
            </section>
          </div>
        </div>
      </main>
      <footer class="footer">
        <div class="footer__inner">
          <p class="footer__text">بازارینو؛خرید ساده و مطمئن</p>
          <ul class="footer__links">
            <li><a href="#"></a>پشتیبانی</li>
            <li><a href="#"></a>قوانین و شرایط</li>
            <li><a href="#"></a>اینستاگرام</li>
          </ul>
          <p class="footer__year">1406</p>
        </div>
      </footer>
    </header>
  </body>
</html>
